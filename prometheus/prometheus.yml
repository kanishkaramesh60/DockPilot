global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: dockpilot
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8001"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
