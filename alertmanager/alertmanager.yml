                <tr><td class="label">Alert Name</td><td>{{ .Labels.alertname }}</td></tr>
                <tr><td class="label">Severity</td><td><strong style="color:#d9534f;">CRITICAL</strong></td></tr>
                <tr><td class="label">Summary</td><td>{{ .Annotations.summary }}</td></tr>
                <tr><td class="label">Description</td><td>{{ .Annotations.description }}</td></tr>
                <tr><td class="label">Target / Container</td><td>{{ if .Labels.container_name }}{{ .Labels.container_name }}{{ else if .Labels.name }}{{ .Labels.name }}{{ else }}{{ .Labels.instance }}{{ end }}</td></tr>
                <tr><td class="label">Started At</td><td>{{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}</td></tr>
                {{ if eq .Status "resolved" }}
                <tr><td class="label">Resolved At</td><td>{{ .EndsAt.Format "2006-01-02 15:04:05 MST" }}</td></tr>
                {{ end }}
              </table>
              <hr style="border: 0; border-top: 1px dashed #ced4da; margin: 16px 0;" />
              {{ end }}
              <div class="footer">
                DockPilot Production Alerting &bull; Immediate Action Required
              </div>
            </div>
          </body>
          </html>

  # 3. Warning alerts receiver
  - name: 'dockpilot-warning-receiver'
    email_configs:
      - to: 'devops-warning@dockpilot.local'
        send_resolved: true
        headers:
          Subject: '[WARNING {{ .Status | toUpper }}] {{ .CommonLabels.alertname }} - DockPilot'
