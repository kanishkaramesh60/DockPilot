            </style>
          </head>
          <body>
            <div class="card">
              <div class="header">
                🚨 CRITICAL ALERT: {{ .CommonLabels.alertname }}
              </div>
              <p>Status: <span class="status-{{ .Status }}">{{ .Status | toUpper }}</span></p>
              {{ range .Alerts }}
